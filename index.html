<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxelcraft — Bedrock 1.4-style Web Voxel World (W1)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236aa84f'/%3E%3Crect y='10' width='16' height='6' fill='%2386603f'/%3E%3Cpath d='M0 10h16v6H0z' fill='%2386603f'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bar-h: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; }
    body { background: #000; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    #app { position: relative; }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

    /* Crosshair */
    .crosshair {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px; line-height: 1; color: rgba(255,255,255,0.85);
      text-shadow: 0 0 2px #000; font-weight: 700; z-index: 20;
    }

    /* Hotbar (bottom center, Bedrock-like) */
    .hotbar {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,0.4);
      border-radius: 6px; border: 2px solid rgba(255,255,255,0.35);
    }
    .hotbar-slot {
      width: 48px; height: 48px; background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.22); border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      image-rendering: pixelated;
    }
    .hotbar-slot.selected { border-color: #fff; background: rgba(255,255,255,0.28); }
    .hotbar-icon { width: 34px; height: 34px; image-rendering: pixelated; }

    /* XP bar above hotbar */
    .xp {
      position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%);
      width: 220px; height: 8px; background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.3); border-radius: 3px;
      transition: opacity .2s;
    }
    .xp::before { content: ''; position: absolute; inset: 0; background: #7fbf3f; border-radius: 2px; }
    .xp-fill { height: 100%; width: 50%; background: #7fbf3f; border-radius: 2px; }

    /* Top-left stats */
    .stats {
      position: absolute; left: 14px; top: 12px; font-size: 20px;
      text-shadow: 0 1px 2px #000; display: flex; flex-direction: column; gap: 2px;
    }
    .hearts { color: #e33; letter-spacing: 1px; }
    .hunger { color: #ca8; letter-spacing: 1px; }
    .oxygen { color: #7af; letter-spacing: 1px; }

    /* Help overlay */
    .help {
      position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
      text-align: center; font-size: 14px; line-height: 1.7;
      color: #fff; text-shadow: 0 1px 3px #000;
      background: rgba(0,0,0,0.45); padding: 16px 24px; border-radius: 8px;
      width: min(560px, 90%); transition: opacity .3s; z-index: 30;
    }

    /* Top-right stats */
    .corner {
      position: absolute; right: 12px; top: 12px; font-size: 13px;
      text-align: right; text-shadow: 0 1px 2px #000; color: #fff; z-index: 20;
      font-variant-numeric: tabular-nums;
    }
    .low { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 13px; color: #dfe; text-shadow: 0 1px 2px #000; z-index: 20; }

    @media (max-width: 640px) {
      .hotbar-slot { width: 36px; height: 36px; }
      .hotbar-icon { width: 26px; height: 26px; }
      .help { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div class="corner">
      <div id="seedlabel">Seed: …</div>
      <div id="stat-fps">pos: -</div>
      <div id="stat-face">chunks: -</div>
    </div>
    <div class="low" id="lowlabel">W1 · World/Render core · Bedrock 1.4-style</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
